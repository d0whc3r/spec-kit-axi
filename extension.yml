schema_version: "1.0"

extension:
  id: axi
  name: "Axi Extension"
  version: "2.0.0"
  description: "A Spec Kit extension that renders a feature's markdown in a local browser review surface for human annotation, then returns the queued notes to the agent to apply."
  author: d0whc3r
  repository: https://github.com/d0whc3r/spec-kit-axi
  homepage: https://d0whc3r.github.io/spec-kit-axi/
  license: MIT
  category: docs
  effect: read-write

requires:
  speckit_version: ">=0.12.17"
  tools:
    - name: node
      version: ">=22.0.0"
      required: true

provides:
  commands:
    - name: speckit.axi.review
      file: commands/speckit.axi.review.md
      description: "Open a feature's markdown in a browser review surface, collect annotations, and apply the queued feedback."

hooks:
  after_specify:
    command: speckit.axi.review
    optional: true
    prompt: "Open spec.md in the browser review surface?"
    description: "Open the feature's markdown, spec.md first, in the browser review surface, then apply the reviewer's notes"
  after_plan:
    command: speckit.axi.review
    optional: true
    prompt: "Open plan.md and the other plan artifacts in the browser review surface?"
    description: "Open plan.md, research.md, data-model.md, and the rest of the feature's markdown in the browser review surface, then apply the reviewer's notes"

tags:
  - annotation
  - axi
  - browser
  - human-in-the-loop
  - markdown
  - review
